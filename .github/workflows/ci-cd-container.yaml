name: continuous-integration

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

  pull_request:
    types: [synchronize]
    branches: [main]
      

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  LOCAL_IMAGE: actualbudget-classifier:${{ github.sha }}

jobs:
  build-image:
    name: build-image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-qemu
        uses: docker/setup-qemu-action@v3

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: export-image
        run: |
          docker save "${LOCAL_IMAGE}" -o image.tar

      - name: upload-image-artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  test-image:
    name: test-image
    needs: build-image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: download-image-artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: load-image
        run: |
          docker load -i image.tar

      - name: verify-container-starts
        run: |
          docker run --rm "${LOCAL_IMAGE}" python --version

      - name: run-unit-tests
        run: |
          docker run --rm \
            "${LOCAL_IMAGE}" \
            python -m unittest discover -s tests -v

  sonarqube:
    name: sonarqube
    needs: test-image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: run-sonarqube-scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@194fe5a05e7f03d8a9a8a1f5b32f0a7f430b53d8
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    name: publish-ghcr
    needs:
      - test-image
      - sonarqube

    if: >
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-qemu
        uses: docker/setup-qemu-action@v3

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: login-ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: docker-metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: build-and-push
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: image-digest
        run: |
          echo "Digest: ${{ steps.build_push.outputs.digest }}"