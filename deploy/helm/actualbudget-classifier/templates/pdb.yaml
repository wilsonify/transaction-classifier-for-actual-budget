{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "actualbudget-classifier.fullname" . }}
  labels:
    {{- include "actualbudget-classifier.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "actualbudget-classifier.selectorLabels" . | nindent 6 }}
{{- end }}
