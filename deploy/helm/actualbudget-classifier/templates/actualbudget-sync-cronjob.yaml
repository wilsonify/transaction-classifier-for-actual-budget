{{- if .Values.actualbudgetIntegration.enabled }}
{{- $actualbudgetBaseUrl := printf "%s://%s:%v" .Values.actualbudgetIntegration.actualbudgetServiceScheme .Values.actualbudgetIntegration.actualbudgetServiceHost .Values.actualbudgetIntegration.actualbudgetServicePort }}
{{- $classifierBaseUrl := printf "%s://%s:%v" .Values.actualbudgetIntegration.classifierServiceScheme .Values.actualbudgetIntegration.classifierServiceHost .Values.actualbudgetIntegration.classifierServicePort }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "actualbudget-classifier.fullname" . }}-actual-sync
  labels:
    {{- include "actualbudget-classifier.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.actualbudgetIntegration.syncCronSchedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "actualbudget-classifier.selectorLabels" . | nindent 12 }}
        spec:
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          restartPolicy: OnFailure
          containers:
            - name: sync-forwarder
              image: curlimages/curl:8.8.0
              command:
                - /bin/sh
                - -ec
                - |
                  if [ -n "{{ .Values.actualbudgetIntegration.authHeader }}" ]; then
                    curl -fsS -H "{{ .Values.actualbudgetIntegration.authHeader }}" "{{ $actualbudgetBaseUrl }}{{ .Values.actualbudgetIntegration.eventFeedPath }}" > /tmp/payload.json
                  else
                    curl -fsS "{{ $actualbudgetBaseUrl }}{{ .Values.actualbudgetIntegration.eventFeedPath }}" > /tmp/payload.json
                  fi
                  if [ -s /tmp/payload.json ]; then
                    if [ -n "{{ .Values.actualbudgetIntegration.authHeader }}" ]; then
                      curl -fsS -X POST "{{ $classifierBaseUrl }}/events/transactions/imported" -H "Content-Type: application/json" -H "{{ .Values.actualbudgetIntegration.authHeader }}" --data-binary @/tmp/payload.json
                    else
                      curl -fsS -X POST "{{ $classifierBaseUrl }}/events/transactions/imported" -H "Content-Type: application/json" --data-binary @/tmp/payload.json
                    fi
                  fi
{{- end }}
