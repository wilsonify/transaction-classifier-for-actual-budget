{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "actualbudget-classifier.fullname" . }}
  labels:
    {{- include "actualbudget-classifier.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "actualbudget-classifier.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.allowFromPods }}
        - podSelector:
            matchExpressions:
              - key: {{ .key | quote }}
                operator: {{ .operator | quote }}
                values:
                  {{- toYaml .values | nindent 18 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  egress:
    - to:
        - podSelector: {}
{{- end }}
