image:
  repository: ghcr.io/example/actualbudget-classifier
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""
  automountServiceAccountToken: false

podAnnotations: {}

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
    ephemeral-storage: 1Gi

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClassName: ""
  mountPath: /data

env:
  ACTUAL_CLASSIFIER_WORKERS: "1"
  ACTUAL_CLASSIFIER_PORT: "8080"

networkPolicy:
  enabled: true
  allowFromNamespaces: []
  allowFromPods:
    - key: app.kubernetes.io/name
      operator: In
      values: ["actualbudget"]

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

retrainingCron:
  enabled: true
  schedule: "0 3 * * *"
  requestedBy: "helm-cron"
  concurrencyPolicy: Forbid

actualbudgetIntegration:
  enabled: false
  actualbudgetServiceScheme: "http"
  actualbudgetServiceHost: "actualbudget"
  actualbudgetServicePort: 5006
  classifierServiceScheme: "http"
  classifierServiceHost: "actualbudget-classifier"
  classifierServicePort: 8080
  eventFeedPath: "/api/classifier/transactions/imported"
  syncNamespace: default
  syncCronSchedule: "*/10 * * * *"
  authHeader: ""
